 # ================================================================
# application-prod.properties — PRODUCTION OVERRIDES
# Activated by: SPRING_PROFILES_ACTIVE=prod (env var on server)
# All sensitive values MUST be supplied via environment variables.
# This file must NOT contain real secrets — it is committed to git.
# ================================================================

# Production DB URL (override to your RDS / cloud MySQL endpoint)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aiproject}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Turn off DDL auto-create in production — run migrations manually
spring.jpa.hibernate.ddl-auto=validate

# Reduce SQL verbosity
spring.jpa.show-sql=false
logging.level.org.springframework.security=WARN
logging.level.root=WARN

# JWT — must be set via environment in prod
jwt.secret=${JWT_SECRET}
