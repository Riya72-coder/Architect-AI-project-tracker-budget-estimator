# ================================================================
# application.properties — SHARED DEFAULTS (committed to git)
# Sensitive values use ${ENV_VAR:fallback} syntax:
#   - ENV_VAR is read from environment at runtime (required in prod)
#   - fallback is used automatically for local dev ONLY
#   - NEVER put real secrets directly in this file
# Activate a profile: -Dspring.profiles.active=dev  OR
#                     set env SPRING_PROFILES_ACTIVE=prod
# ================================================================

spring.application.name=backend

# ===================== DATABASE =====================
spring.datasource.url=jdbc:mysql://localhost:3306/aiproject
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:[PASSWORD]}

# ===================== JPA =====================
spring.jpa.hibernate.ddl-auto=update

# ===================== SERVER =====================
server.port=5000

# ===================== FILE UPLOAD =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================== JWT =====================
# Set JWT_SECRET env var in production (min 32 chars recommended).
jwt.secret=${JWT_SECRET:aiproject-jwt-secret-key-must-be-32charss}